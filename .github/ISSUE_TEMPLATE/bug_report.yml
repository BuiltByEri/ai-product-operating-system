name: Bug Report
description: Report a problem with repository validation, documentation links, or release packaging.
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Describe the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should have happened?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Include public-safe details only.
    validations:
      required: false
